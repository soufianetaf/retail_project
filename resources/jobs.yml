resources:
  jobs:
    gold_aggregation_job:
      name: retail_gold_job_${bundle.target}
      
      tasks:
        - task_key: run_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_pipeline.id}
            
        - task_key: run_silver
          depends_on:
            - task_key: run_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_pipeline.id}
            
        - task_key: build_gold
          depends_on:
            - task_key: run_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}
                - task_key: validate_data
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ../tests/integration/validate_gold.py
            base_parameters:
              catalog_name: ${var.catalog}
            
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: Europe/Paris
      email_notifications:
        on_failure:
          - "tafahisoufiane9@gmail.com"