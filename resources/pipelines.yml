resources:
  pipelines:
    bronze_pipeline:
      name: retail_bronze_${bundle.target}
      catalog: ${var.catalog}
      target: bronze
      serverless: true
      libraries:
        - notebook:
            path: ../src/bronze/ingest_all.py
      configuration:
        landing_path: ${var.landing_path}

    silver_pipeline:
      name: retail_silver_${bundle.target}
      catalog: ${var.catalog}
      target: silver
      serverless: true
      libraries:
        - notebook:
            path: ../src/silver/clean_all.py
      configuration:
        catalog_name: ${var.catalog}
    gold_pipeline:
      name: retail_gold_${bundle.target}
      catalog: ${var.catalog}
      target: gold
      serverless: true
      libraries:
        - notebook:
            path: ../src/gold/sales_aggregates.py
      configuration:
        catalog_name: ${var.catalog}